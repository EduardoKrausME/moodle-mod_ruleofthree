name: Rebuild AMD once

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[rebuild-amd]')
    runs-on: ubuntu-22.04
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4

      - name: Check out Moodle 4.5
        uses: actions/checkout@v4
        with:
          repository: moodle/moodle
          ref: MOODLE_405_STABLE
          path: moodle

      - name: Install Moodle JavaScript dependencies
        working-directory: moodle
        run: npm ci

      - name: Build plugin AMD module
        run: |
          mkdir -p moodle/mod/ruleofthree
          rsync -a --delete --exclude='.git' --exclude='moodle' ./ moodle/mod/ruleofthree/
          cd moodle
          npx grunt amd --root=mod/ruleofthree
          cd ..
          cp moodle/mod/ruleofthree/amd/build/calculator.min.js amd/build/calculator.min.js
          cp moodle/mod/ruleofthree/amd/build/calculator.min.js.map amd/build/calculator.min.js.map

      - name: Commit generated AMD files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add amd/build/calculator.min.js amd/build/calculator.min.js.map
          if git diff --cached --quiet; then
            echo "AMD files are already current."
            exit 0
          fi
          git commit -m "Build AMD with Moodle Grunt"
          git push
